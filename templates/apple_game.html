<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Fortune | NovaTrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #f0f4ff; touch-action: pan-y; }
        
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* FENÊTRE DE JEU COULISSANTE */
        .game-viewport {
            height: 350px; /* Taille fixe de la fenêtre */
            overflow-y: auto; /* Active le défilement vertical */
            background: #e5e7eb;
            border-radius: 15px;
            position: relative;
            border: 2px solid #fff;
            scroll-behavior: smooth; /* Animation douce lors du scroll automatique */
        }

        /* Masquer la barre de défilement pour un look plus propre */
        .game-viewport::-webkit-scrollbar {
            width: 4px;
        }
        .game-viewport::-webkit-scrollbar-thumb {
            background: #5a57e3;
            border-radius: 10px;
        }

        .game-grid {
            display: flex;
            flex-direction: column-reverse; /* Niveau 1 en bas, Niveau 16 en haut */
            min-height: 1280px; /* 16 lignes * 80px */
        }

        .game-row {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            height: 80px;
            padding: 10px;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .cell {
            height: 50px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 1px solid #ddd;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cell.active {
            border: 2px solid #5a57e3;
            background: #fff;
            box-shadow: 0 0 8px rgba(90, 87, 227, 0.2);
        }

        .cell.disabled {
            opacity: 0.5;
            pointer-events: none;
            background: #f9fafb;
        }

        .loader {
            width: 20px; height: 20px;
            border: 3px solid #FFF; border-bottom-color: transparent;
            border-radius: 50%; display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="glass w-full max-w-md p-6">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-lg font-800 text-gray-800">Apple Fortune</h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase">Niveau actuel: <span id="lvl-display">0</span>/16</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-gray-400 font-bold uppercase">Gains</p>
            <p class="text-xl font-black text-indigo-600"><span id="gain-txt">0</span> F</p>
        </div>
    </div>

    <div class="game-viewport" id="viewport">
        <div id="game-grid" class="game-grid">
            </div>
    </div>

    <div id="ui-controls" class="mt-4">
        <button id="start-btn" onclick="startGame()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2">
            COMMENCER LA PARTIE
        </button>

        <button id="cashout-btn" onclick="processCashout()" class="hidden w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2">
            ENCAISSER <span id="cashout-val">0</span> F
        </button>
    </div>
</div>

<script>
    let currentLevel = 0;
    let currentGain = 0;
    let gameData = [];
    const totalLevels = 16;
    const grid = document.getElementById('game-grid');
    const viewport = document.getElementById('viewport');

    function buildGrid() {
        grid.innerHTML = '';
        for (let i = 0; i < totalLevels; i++) {
            const row = document.createElement('div');
            row.className = 'game-row';
            row.id = `row-${i}`;
            for (let j = 0; j < 8; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell disabled';
                cell.id = `cell-${i}-${j}`;
                cell.onclick = () => clickCell(i, j);
                row.appendChild(cell);
            }
            grid.appendChild(row);
        }
        // Scroll tout en bas au début pour voir le niveau 1
        setTimeout(() => { viewport.scrollTop = viewport.scrollHeight; }, 100);
    }

    function startGame() {
        const btn = document.getElementById('start-btn');
        btn.innerHTML = '<span class="loader"></span> Préparation...';
        btn.disabled = true;

        // Génération des bombes selon tes nouvelles règles
        gameData = [];
        for (let i = 0; i < totalLevels; i++) {
            let bombs = [];
            let count = 0;

            // Définition du nombre de bombes par niveau (i est l'index de 0 à 15)
            if (i === 0) count = 0;      // Niveau 1 : 0 pourri
            else if (i === 1) count = 0; // Niveau 2 : 0 pourri
            else if (i === 2) count = 1; // Niveau 3 : 1 pourri
            else if (i === 3) count = 2; // Niveau 4 : 2 pourri
            else if (i === 4) count = 3; // Niveau 5 : 3 pourri
            else if (i === 5) count = 3; // Niveau 6 : 3 pourri
            else if (i === 6) count = 4; // Niveau 7 : 4 pourri
            else if (i === 7) count = 5; // Niveau 8 : 5 pourri
            else count = 6;              // Niveau 9 à 16 : 6 pourris

            // Placement aléatoire des bombes dans la ligne
            while(bombs.length < count) {
                let r = Math.floor(Math.random() * 8);
                if(!bombs.includes(r)) bombs.push(r);
            }
            gameData.push(bombs);
        }

        setTimeout(() => {
            btn.classList.add('hidden');
            document.getElementById('cashout-btn').classList.remove('hidden');
            currentLevel = 0;
            currentGain = 0;
            document.getElementById('gain-txt').innerText = "0";
            document.getElementById('lvl-display').innerText = "1";
            activateRow(0);
        }, 500);
    }


    function activateRow(lvl) {
        document.querySelectorAll('.cell').forEach(c => {
            c.classList.add('disabled');
            c.classList.remove('active');
        });

        const row = document.getElementById(`row-${lvl}`);
        if(row) {
            row.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('disabled');
                c.classList.add('active');
            });
            // AUTO-SCROLL : On centre la ligne active dans la fenêtre
            const rowPos = row.offsetTop;
            viewport.scrollTo({
                top: rowPos - (viewport.clientHeight / 2) + 40,
                behavior: 'smooth'
            });
        }
    }

    function clickCell(lvl, col) {
        if(lvl !== currentLevel) return;

        const cell = document.getElementById(`cell-${lvl}-${col}`);

        if(gameData[lvl].includes(col)) {
            // L'utilisateur a touché une bombe
            cell.innerHTML = '<i class="fas fa-leaf text-yellow-500"></i>';
            cell.style.background = "#fee2e2";
            
            // On désactive les clics pour éviter les doubles clics pendant l'animation
            document.querySelectorAll('.cell').forEach(c => c.classList.add('disabled'));

            setTimeout(() => { 
                alert("PERDU ! Vous repartez avec vos gains accumulés : " + currentGain + " F"); 
                processCashout(); // Crédite le dernier prix et redirige
            }, 600);

        } else {
            // L'utilisateur a trouvé une pomme
            cell.innerHTML = '<i class="fas fa-apple-alt text-green-600"></i>';
            cell.style.background = "#dcfce7";
            currentGain += 25;
            currentLevel++;

            document.getElementById('gain-txt').innerText = currentGain;
            document.getElementById('cashout-val').innerText = currentGain;
            document.getElementById('lvl-display').innerText = (currentLevel + 1 > 16) ? 16 : currentLevel + 1;

            if(currentLevel < totalLevels) {
                activateRow(currentLevel);
            } else {
                alert("Jackpot ! Félicitations !");
                processCashout();
            }
        }
    }


    async function processCashout() {
        const btn = document.getElementById('cashout-btn');
        btn.innerHTML = '<span class="loader"></span> Encaissement...';
        btn.disabled = true;
        try {
            const response = await fetch('/game/apple', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({gain: currentGain})
            });
            const res = await response.json();
            alert(res.message);
            window.location.href = "/dashboard";
        } catch(e) {
            alert("Erreur");
            btn.disabled = false;
        }
    }

    buildGrid();
</script>
</body>
</html>
