<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin NovaTrade</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
    background:#e5ddd5;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    background:#5a57e3;
    color:white;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

.header img{
    width:35px;
    height:35px;
    border-radius:50%;
}

/* CHAT */
.chat-box{
    flex:1;
    overflow:auto;
    padding:15px;
}

.msg-card{
    background:white;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
}

.msg-card img,.msg-card video{
    max-width:250px;
    margin-top:5px;
    border-radius:5px;
}

.actions{
    margin-top:5px;
    display:flex;
    gap:10px;
    font-size:13px;
}

.delete{color:red;}
.edit{color:#5a57e3;cursor:pointer}

/* INPUT */
.bottom-bar{
    display:flex;
    padding:10px;
    background:#f0f2f5;
    gap:5px;
}

.input-group{
    flex:1;
    background:white;
    border-radius:20px;
    display:flex;
    align-items:center;
    padding:5px;
}

.input-group input{
    flex:1;
    border:none;
    outline:none;
    padding:8px;
}

.btn-action{
    background:#5a57e3;
    color:white;
    border:none;
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.recording{
    background:red;
}

/* PREVIEW */
.preview{
    padding:5px;
    font-size:12px;
    color:#555;
}

/* LOADER */
.loader{
    display:none;
    position:absolute;
    right:70px;
    bottom:20px;
}

.loader div{
    width:20px;
    height:20px;
    border:3px solid #ccc;
    border-top:3px solid #5a57e3;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="header">
    <a href="/chaine" style="color:white"><i class="fa fa-arrow-left"></i></a>
    <img src="/static/images/n.jpg">
    <div>{{ sub_count }} abonnés</div>
</div>

<div class="chat-box">
{% for msg in messages %}
<div class="msg-card">

<p id="text-{{ msg.id }}">{{ msg.content }}</p>

{% if msg.media_type == 'image' %}
<img src="{{ msg.media_url }}">

{% elif msg.media_type == 'video' %}
<video src="{{ msg.media_url }}" controls></video>

{% elif msg.media_type == 'audio' %}
<audio controls style="width:100%">
    <source src="{{ msg.media_url }}">
</audio>
{% endif %}

<div style="font-size:10px">Type: {{ msg.media_type }}</div>

<div class="actions">
    <a href="/delete_msg/{{ msg.id }}" class="delete">Supprimer</a>
    <span onclick="editMsg({{ msg.id }})" class="edit">Modifier</span>
</div>

</div>
{% endfor %}
</div>

<form class="bottom-bar" method="POST" enctype="multipart/form-data" id="msgForm">

<div class="input-group">
    <input type="text" name="content" id="txtInput" placeholder="Message">

    <label for="mediaIn" style="cursor:pointer">
        <i class="fa fa-paperclip"></i>
    </label>

    <input type="file" name="media" id="mediaIn" hidden>
</div>

<div class="loader" id="loader"><div></div></div>

<button type="button" id="mainBtn" class="btn-action">
    <i class="fa fa-microphone" id="icon"></i>
</button>

<input type="file" name="audio" id="audioHidden" hidden>

</form>

<div class="preview" id="preview"></div>

<script>
let recorder, chunks=[], isRecording=false;

const btn=document.getElementById("mainBtn");
const icon=document.getElementById("icon");
const form=document.getElementById("msgForm");
const txtInput=document.getElementById("txtInput");
const mediaIn=document.getElementById("mediaIn");
const audioHidden=document.getElementById("audioHidden");
const preview=document.getElementById("preview");
const loader=document.getElementById("loader");

// 📎 PREVIEW FICHIER
mediaIn.onchange=()=>{
    if(mediaIn.files.length){
        preview.innerText="Fichier sélectionné : "+mediaIn.files[0].name;
    }
};

btn.onclick=async()=>{

    // 🔥 ENVOI NORMAL
    if(txtInput.value.trim() !== "" || mediaIn.files.length > 0 || audioHidden.files.length > 0){
        loader.style.display="block";
        form.submit();
        return;
    }

    // ❌ PAS DE MICRO
    if(!navigator.mediaDevices){
        alert("Micro non supporté");
        audioHidden.click();
        return;
    }

    // 🎤 START RECORD
    if(!isRecording){

        const stream=await navigator.mediaDevices.getUserMedia({audio:true});

        recorder=new MediaRecorder(stream);
        chunks=[];

        recorder.ondataavailable=e=>chunks.push(e.data);

        recorder.onstop=()=>{
            const blob=new Blob(chunks,{type:"audio/webm"});
            const file=new File([blob],"vocal.webm");

            const dt=new DataTransfer();
            dt.items.add(file);
            audioHidden.files=dt.files;

            loader.style.display="block";
            form.submit();
        };

        recorder.start();
        isRecording=true;
        btn.classList.add("recording");
        icon.className="fa fa-stop";

    }else{
        recorder.stop();
        isRecording=false;
        btn.classList.remove("recording");
        icon.className="fa fa-microphone";
    }
};

// ✏️ MODIFIER MESSAGE
function editMsg(id){
    const el=document.getElementById("text-"+id);
    const oldText=el.innerText;

    const newText=prompt("Modifier :",oldText);
    if(newText===null) return;

    fetch(`/edit_msg/${id}`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({content:newText})
    })
    .then(res=>res.json())
    .then(data=>{
        if(data.success){
            el.innerText=newText;
        }else{
            alert("Erreur modification");
        }
    });
}
</script>

</body>
</html>
