<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin NovaTrade</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#e5ddd5;height:100vh;display:flex;flex-direction:column}

.header{background:#5a57e3;color:white;padding:10px;display:flex;align-items:center;gap:10px}
.header img{width:35px;height:35px;border-radius:50%}

.chat-box{flex:1;overflow:auto;padding:15px}

.msg-card{background:white;padding:10px;border-radius:10px;margin-bottom:15px}
.msg-card img,.msg-card video{max-width:250px;margin-top:5px;border-radius:5px}

.bottom-bar{display:flex;padding:10px;background:#f0f2f5;gap:5px}
.input-group{flex:1;background:white;border-radius:20px;display:flex;align-items:center;padding:5px}
.input-group input{flex:1;border:none;outline:none;padding:8px}

.btn-action{background:#5a57e3;color:white;border:none;width:45px;height:45px;border-radius:50%}

.recording{background:red}
</style>
</head>

<body>

<div class="header">
    <a href="/chaine" style="color:white"><i class="fa fa-arrow-left"></i></a>
    <img src="/static/images/n.jpg">
    <div>{{ sub_count }} abonnés</div>
</div>

<div class="chat-box">
{% for msg in messages %}
<div class="msg-card">
<p>{{ msg.content }}</p>

{% if msg.media_type == 'image' %}
<img src="{{ msg.media_url }}">

{% elif msg.media_type == 'video' %}
<video src="{{ msg.media_url }}" controls></video>

{% elif msg.media_type == 'audio' %}
<audio controls style="width:100%">
    <source src="{{ msg.media_url }}">
</audio>
{% endif %}

<div style="font-size:10px">Type: {{ msg.media_type }}</div>
</div>
{% endfor %}
</div>

<form class="bottom-bar" method="POST" enctype="multipart/form-data" id="msgForm">

<div class="input-group">
<input type="text" name="content" id="txtInput" placeholder="Message">
<input type="file" name="media" id="mediaIn" hidden>
</div>

<button type="button" id="mainBtn" class="btn-action">
<i class="fa fa-microphone" id="icon"></i>
</button>

<input type="file" name="audio" id="audioHidden" hidden>

</form>

<script>
let recorder, chunks=[], isRecording=false;

const btn=document.getElementById("mainBtn");
const icon=document.getElementById("icon");
const form=document.getElementById("msgForm");

btn.onclick=async()=>{

// 🔥 ENVOI
if(txtInput.value || mediaIn.files.length || audioHidden.files.length){
    if(isRecording){
        stopAndSend();
    }else{
        form.submit();
    }
    return;
}

// 🔥 PAS DE MICRO → fallback
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("Micro non supporté → sélection audio");
    audioHidden.click();
    return;
}

// 🔥 START RECORD
if(!isRecording){

const stream=await navigator.mediaDevices.getUserMedia({audio:true});

// 🔥 FORMAT AUTO
let mime="audio/webm";
if(!MediaRecorder.isTypeSupported(mime)){
    mime="audio/mp4";
}

recorder=new MediaRecorder(stream,{mimeType:mime});
chunks=[];

recorder.ondataavailable=e=>chunks.push(e.data);

recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const ext=mime.includes("mp4")?"mp4":"webm";

    const file=new File([blob],`vocal.${ext}`,{type:mime});

    const dt=new DataTransfer();
    dt.items.add(file);
    audioHidden.files=dt.files;

    form.submit();
};

recorder.start();
isRecording=true;
btn.classList.add("recording");
icon.className="fa fa-stop";

}else{
recorder.stop();
isRecording=false;
btn.classList.remove("recording");
icon.className="fa fa-microphone";
}

};

function stopAndSend(){
recorder.stop();
}
</script>

</body>
</html>
