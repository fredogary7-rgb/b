<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Soldes - NovaTrade Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #e1e9ff;
            background-image: radial-gradient(at 0% 0%, rgba(197, 202, 255, 0.5) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(225, 200, 255, 0.4) 0px, transparent 50%);
            min-height: 100vh;
            color: #444;
            padding: 15px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header-box {
            background: white;
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .header-title { display: flex; align-items: center; gap: 12px; color: #5a57e3; }
        .header-title h2 { font-size: 18px; font-weight: 700; }

        .search-container { position: relative; }
        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
            outline: none;
            font-size: 14px;
            background: #f8fafc;
        }
        .search-container i { position: absolute; left: 18px; top: 14px; color: #94a3b8; }

        .table-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }

        th { background: #f8fafc; padding: 15px; text-align: left; color: #5a57e3; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }

        .edit-input {
            width: 110px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
            background: #fcfcfc;
        }
        .edit-input:focus { border-color: #5a57e3; background: white; box-shadow: 0 0 8px rgba(90, 87, 227, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .rank-badge {
            display: inline-block; width: 28px; height: 28px; line-height: 28px;
            text-align: center; background: #f1f5f9; border-radius: 8px;
            font-weight: 700; color: #475569; font-size: 12px;
        }

        .status-pill { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-passive { background: #f1f5f9; color: #64748b; }

        #toast {
            position: fixed; bottom: 20px; right: 20px; background: #22c55e; color: white;
            padding: 12px 25px; border-radius: 15px; display: none; z-index: 9999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

<div id="toast">✅ Enregistré</div>

<div class="container">
    <div class="header-box">
        <div class="header-top">
            <div class="header-title">
                <i class="fa fa-users-gear fa-lg"></i>
                <h2>Gestion des Soldes</h2>
            </div>
            <a href="/dashboard" style="text-decoration:none; color:#5a57e3; font-size:13px; font-weight:600;">
                <i class="fa fa-arrow-left"></i> Retour
            </a>
        </div>
        <div class="search-container">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Chercher un pseudo ou téléphone...">
        </div>
    </div>

    <div class="table-card">
        <div class="table-wrapper">
            <table id="userTable">
                <thead>
                    <tr>
                        <th style="width: 60px;">Rang</th>
                        <th>Utilisateur</th>
                        <th>Investissement</th>
                        <th>Solde Jeux</th>
                        <th>Commissions</th>
                        <th>Bonus</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    {% for u in utilisateurs %}
                    <tr class="user-row">
                        <td><span class="rank-badge">{{ loop.index }}</span></td>
                        <td>
                            <strong class="username-text">{{ u.username }}</strong>
                            <br><small style="color:#888;">{{ u.phone }}</small>
                            <br>
                            {% if u.premier_depot %}
                                <span class="status-pill status-active">Actif</span>
                            {% else %}
                                <span class="status-pill status-passive">Passif</span>
                            {% endif %}
                        </td>

                        <td>
                            <input type="number" class="edit-input" 
                                   onchange="saveData('{{ u.username }}', 'solde_revenu', this)"
                                   value="{{ u.solde_revenu or 0 }}" style="color: #5a57e3;">
                        </td>

                        <td>
                            <input type="number" class="edit-input" 
                                   onchange="saveData('{{ u.username }}', 'solde_jeux', this)"
                                   value="{{ u.solde_jeux or 0 }}" style="color: #e67e22;">
                        </td>

                        <td>
                            <input type="number" class="edit-input" 
                                   onchange="saveData('{{ u.username }}', 'solde_parrainage', this)"
                                   value="{{ u.solde_parrainage or 0 }}" style="color: #27ae60;">
                        </td>

                        <td>
                            <input type="number" class="edit-input" 
                                   onchange="saveData('{{ u.username }}', 'bonus', this)"
                                   value="{{ u.bonus or 0 }}" style="color: #9b59b6;">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // RECHERCHE
    document.getElementById('searchInput').addEventListener('keyup', function() {
        let filter = this.value.toLowerCase();
        let rows = document.querySelectorAll('.user-row');
        rows.forEach(row => {
            let text = row.innerText.toLowerCase();
            row.style.display = text.includes(filter) ? "" : "none";
        });
    });

    // SAUVEGARDE DIRECTE
    function saveData(username, field, inputElement) {
        fetch('/admin/update-solde', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: username,
                field: field,
                value: inputElement.value
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                showToast();
            } else {
                alert("Erreur: " + data.error);
            }
        });
    }

    function showToast() {
        let t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 1500);
    }
</script>

</body>
</html>
