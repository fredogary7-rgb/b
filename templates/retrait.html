<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrait - NovaTrade</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#e1e9ff;
background-image:
radial-gradient(at 0% 0%, rgba(197,202,255,0.5) 0px, transparent 50%),
radial-gradient(at 100% 100%, rgba(225,200,255,0.4) 0px, transparent 50%);
min-height:100vh;
padding:20px;
color:#444;
}

.container{max-width:550px;margin:0 auto;}

.page-header{
text-align:center;
margin-bottom:25px;
}

.page-header h1{
font-size:22px;
color:#5a57e3;
font-weight:700;
}

.main-card{
background:rgba(255,255,255,0.6);
backdrop-filter:blur(15px);
padding:30px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.4);
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

h2{
font-size:18px;
margin-bottom:15px;
color:#1e293b;
text-align:center;
}

.notice{
background:rgba(90,87,227,0.1);
border-left:4px solid #5a57e3;
padding:15px;
border-radius:12px;
font-size:13px;
margin-bottom:25px;
color:#475569;
}

label{
display:block;
margin-bottom:8px;
font-size:13px;
font-weight:600;
color:#64748b;
}

input,select{
width:100%;
padding:14px 15px;
border-radius:15px;
border:1px solid rgba(255,255,255,0.8);
background:rgba(255,255,255,0.9);
font-size:14px;
margin-bottom:18px;
outline:none;
}

button{
width:100%;
padding:16px;
border-radius:15px;
border:none;
background:#5a57e3;
color:#fff;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
}

/* FLASH */
.flash{
padding:12px;
border-radius:12px;
font-size:13px;
margin-bottom:12px;
}
.flash.success{background:#dcfce7;color:#166534;}
.flash.danger{background:#fee2e2;color:#991b1b;}

/* PIN BOX */
.pin-box{
margin-top:20px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.7);
border:1px solid rgba(255,255,255,0.5);
}

/* LOADER */
.loader-bg{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.4);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.loader-box{
background:#fff;
padding:25px;
border-radius:15px;
text-align:center;
width:220px;
}

.spinner{
width:40px;
height:40px;
border:4px solid #eee;
border-top:4px solid #5a57e3;
border-radius:50%;
margin:0 auto 10px;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<!-- LOADER -->
<div class="loader-bg" id="loader">
    <div class="loader-box">
        <div class="spinner"></div>
        <div>Traitement en cours...</div>
    </div>
</div>

<div class="container">

<div class="page-header">
<h1>NovaTrade Retrait</h1>
</div>

<div class="main-card">

<h2>Demande de retrait</h2>

<div class="notice">
<i class="fa fa-lock"></i>
Paiement sécurisé avec code PIN obligatoire
</div>

<!-- FLASH -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}

<!-- ===================== -->
<!-- FORM RETRAIT -->
<!-- ===================== -->
<form method="POST" onsubmit="showLoader()">

<label>Mode de paiement</label>
<select name="payment_method" required>
<option value="" disabled selected>Choisir un mode</option>
{% for service in services %}
<option value="{{ service.id }}">{{ service.name }}</option>
{% endfor %}
</select>

<label>Montant (XOF)</label>
<input type="number" name="montant" required min="1">

<label>Numéro de paiement</label>
<input type="tel" name="phone" value="{{ user.phone }}" required>

<!-- PIN -->
<label>Code PIN (6 chiffres)</label>
<input type="password"
       name="pin"
       maxlength="6"
       pattern="\d{6}"
       required>

<button type="submit" id="btn">
Confirmer le retrait
</button>

</form>

</div>

<footer style="text-align:center;margin-top:20px;font-size:12px;opacity:0.6;">
2026 © NovaTrade
</footer>

</div>

<script>
function showLoader(){
    document.getElementById("loader").style.display = "flex";
    document.getElementById("btn").innerText = "Traitement...";
    document.getElementById("btn").disabled = true;
}
</script>

</body>
</html>
