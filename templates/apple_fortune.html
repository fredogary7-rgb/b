<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple of Fortune - NovaTrade</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background: #e1e9ff; min-height: 100vh; color: #444; }

        /* ÉCRAN DE VERROUILLAGE */
        #lock-screen {
            position: fixed; inset: 0; background: #e1e9ff;
            display: none; flex-direction: column; align-items: center;
            justify-content: center; z-index: 9999; text-align: center; padding: 20px;
        }

        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid white;
        }

        .game-wrapper { max-width: 400px; margin: 10px auto; padding: 15px; }

        /* GRILLE */
        .grid { display: flex; flex-direction: column-reverse; gap: 8px; max-height: 400px; overflow-y: auto; padding: 10px; background: rgba(255,255,255,0.3); border-radius: 15px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; opacity: 0.2; pointer-events: none; transition: 0.3s; padding: 5px; }
        .row.active { opacity: 1; pointer-events: all; background: rgba(90, 87, 227, 0.1); border-radius: 10px; }

        .cell {
            aspect-ratio: 1/1; background: white; border: 2px solid #5a57e3;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .cell.good { background: #dcfce7; border-color: #22c55e; color: #16a34a; }
        .cell.bad { background: #fee2e2; border-color: #ef4444; color: #dc2626; }

        .status-box { background: white; padding: 20px; border-radius: 20px; margin-top: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .btn-main {
            background: #5a57e3; color: white; border: none; padding: 15px;
            border-radius: 15px; font-weight: 700; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-cashout { background: #16a34a; margin-top: 10px; display: none; }

        .loader { width: 18px; height: 18px; border: 2px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="lock-screen">
    <i class="fa fa-lock" style="font-size: 50px; color: #5a57e3; margin-bottom: 20px;"></i>
    <h2 id="lock-title">Bientôt disponible</h2>
    <p id="lock-msg" style="margin-top: 10px; color: #666;"></p>
    <a href="/dashboard" style="margin-top: 20px; color: #5a57e3; font-weight: bold;">Retour au Dashboard</a>
</div>

<div class="topbar">
    <a href="/dashboard" style="color:#5a57e3;"><i class="fa fa-chevron-left"></i></a>
    <div style="font-weight:700; color:#5a57e3;">APPLE FORTUNE</div>
    <div id="gain-display" style="background:#5a57e3; color:white; padding:5px 12px; border-radius:20px; font-size:12px; font-weight: bold;">
        0 XOF
    </div>
</div>

<div class="game-wrapper">
    <div class="grid" id="appleGrid"></div>

    <div class="status-box">
        <div id="step-info" style="margin-bottom:15px; font-weight:700; color:#5a57e3;">Prêt à jouer ?</div>
        
        <button id="playBtn" class="btn-main" onclick="startAttempt()">
            JOUER MAINTENANT (1 CHANCE)
        </button>

        <button id="cashoutBtn" class="btn-main btn-cashout" onclick="processCashout()">
            ENCAISSER <span id="cash-val">0</span> XOF
        </button>
    </div>
</div>

<script>
    const totalRows = 10;
    let currentStep = 0;
    let currentGain = 0;
    let gameActive = false;
    let gameData = [];

    function checkRestrictions() {
        const now = new Date();
        const day = now.getDay(); // 1 = Lundi
        const hour = now.getHours();
        const lockScreen = document.getElementById('lock-screen');
        
        // Restriction Lundi 8h
        if (day !== 1 || hour < 8) {
            lockScreen.style.display = 'flex';
            document.getElementById('lock-msg').innerText = "Le jeu ouvre tous les lundis à partir de 08:00.";
            return false;
        }

        // Restriction 1 seule chance (Localstorage pour le front)
        const lastPlayed = localStorage.getItem('apple_last_played');
        const today = now.toDateString();
        if (lastPlayed === today) {
            lockScreen.style.display = 'flex';
            document.getElementById('lock-title').innerText = "Déjà joué";
            document.getElementById('lock-msg').innerText = "Vous avez déjà utilisé votre chance aujourd'hui. Revenez lundi prochain !";
            return false;
        }
        return true;
    }

    function createGrid() {
        const grid = document.getElementById('appleGrid');
        grid.innerHTML = '';
        for (let i = 0; i < totalRows; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            row.id = `row-${i}`;
            for (let j = 0; j < 5; j++) {
                row.innerHTML += `<div class="cell" onclick="checkApple(${i}, ${j})"><i class="fa fa-question" style="opacity:0.1"></i></div>`;
            }
            grid.appendChild(row);
        }
    }

    function startAttempt() {
        if (!checkRestrictions()) return;

        const btn = document.getElementById('playBtn');
        btn.innerHTML = '<span class="loader"></span> Chargement...';
        
        // Génération des bombes selon tes règles
        gameData = [];
        for (let i = 0; i < totalRows; i++) {
            let count = 0;
            if (i === 0) count = 0;
            else if (i === 1 || i === 2) count = 1;
            else if (i === 3) count = 2;
            else if (i === 4) count = 3;
            else count = 5;

            let bombs = [];
            while(bombs.length < count) {
                let r = Math.floor(Math.random() * 5);
                if(!bombs.includes(r)) bombs.push(r);
            }
            gameData.push(bombs);
        }

        setTimeout(() => {
            gameActive = true;
            btn.style.display = 'none';
            document.getElementById('cashoutBtn').style.display = 'flex';
            activateRow(0);
        }, 800);
    }

    function activateRow(step) {
        document.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
        const row = document.getElementById(`row-${step}`);
        row.classList.add('active');
        document.getElementById('step-info').innerText = `NIVEAU ${step + 1} / 10`;
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function checkApple(rowIdx, cellIdx) {
        if (!gameActive || rowIdx !== currentStep) return;

        const cells = document.getElementById(`row-${rowIdx}`).querySelectorAll('.cell');

        if (!gameData[rowIdx].includes(cellIdx)) {
            cells[cellIdx].className = 'cell good';
            cells[cellIdx].innerHTML = '<i class="fa fa-apple-alt"></i>';
            currentGain += 25;
            document.getElementById('gain-display').innerText = currentGain + " XOF";
            document.getElementById('cash-val').innerText = currentGain;
            
            currentStep++;
            if (currentStep < totalRows) {
                activateRow(currentStep);
            } else {
                await processCashout();
            }
        } else {
            cells[cellIdx].className = 'cell bad';
            cells[cellIdx].innerHTML = '<i class="fa fa-bomb"></i>';
            gameActive = false;
            // Marquer comme joué même si perdu
            localStorage.setItem('apple_last_played', new Date().toDateString());
            setTimeout(() => { alert("PERDU ! Vous avez touché une bombe."); location.reload(); }, 600);
        }
    }

    async function processCashout() {
        if (currentGain <= 0) return;
        gameActive = false;
        const btn = document.getElementById('cashoutBtn');
        btn.innerHTML = '<span class="loader"></span> Encaissement...';

        const res = await fetch('/game/apple-reward', { 
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ gain: currentGain })
        });
        
        const data = await res.json();
        if (data.status === 'success') {
            localStorage.setItem('apple_last_played', new Date().toDateString());
            alert("FÉLICITATIONS ! " + currentGain + " XOF ajoutés.");
            window.location.href = "/dashboard";
        }
    }

    window.onload = () => {
        checkRestrictions();
        createGrid();
    };
</script>
</body>
</html>
