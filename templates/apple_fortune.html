<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple of Fortune Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background: #e1e9ff; min-height: 100vh; color: #444; }
        
        .topbar { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:white; border-bottom:1px solid #ddd; }
        .grid { display: flex; flex-direction: column-reverse; gap: 8px; padding: 15px; background: rgba(255,255,255,0.3); border-radius: 15px; margin-top:10px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; opacity: 0.3; pointer-events: none; transition: 0.3s; }
        .row.active { opacity: 1; pointer-events: all; background: rgba(90, 87, 227, 0.05); border-radius: 10px; }
        .cell { aspect-ratio: 1/1; background: white; border: 2px solid #5a57e3; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .cell.good { background: #dcfce7; border-color: #22c55e; color: #16a34a; }
        .cell.bad { background: #fee2e2; border-color: #ef4444; color: #dc2626; }
        .btn-main { background: #5a57e3; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px;}
        #lock-screen { position: fixed; inset: 0; background: #e1e9ff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; }
    </style>
</head>
<body>

{% if not ouvert %}
<div id="lock-screen">
    <i class="fa fa-calendar-alt" style="font-size: 60px; color: #5a57e3;"></i>
    <h2 style="margin-top:20px;">Verger Fermé</h2>
    <p style="margin-top:10px; color:#666;">Ouverture tous les <b>lundis à 08:00</b>.</p>
    <a href="/dashboard" style="margin-top:20px; color:#5a57e3; text-decoration:none; font-weight:bold;">Retour au Dashboard</a>
</div>
{% elif user.frog_game_done %}
<div id="lock-screen">
    <i class="fa fa-check-circle" style="font-size: 60px; color: #16a34a;"></i>
    <h2 style="margin-top:20px;">Session terminée</h2>
    <p style="margin-top:10px; color:#666;">Revenez lundi prochain pour une nouvelle récolte !</p>
    <a href="/dashboard" style="margin-top:20px; color:#5a57e3; text-decoration:none; font-weight:bold;">Retour au Dashboard</a>
</div>
{% endif %}

<div class="topbar">
    <a href="/dashboard" style="color:#5a57e3;"><i class="fa fa-chevron-left"></i></a>
    <span>GAIN: <b id="gain-val">0</b> XOF</span>
    <span id="step-info" style="font-weight:bold; color:#5a57e3;">NIVEAU 1/10</span>
</div>

<div style="max-width:400px; margin:auto; padding:20px;">
    <div class="grid" id="appleGrid"></div>
    <button id="startBtn" class="btn-main" onclick="initGame()">COMMENCER LA RÉCOLTE</button>
    <button id="cashBtn" class="btn-main" style="background:#16a34a; display:none;" onclick="cashout()">ENCAISSER LES GAINS</button>
</div>

<script>
    let currentStep = 0;
    let gameRunning = false;

    function createGrid() {
        const grid = document.getElementById('appleGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            row.id = `row-${i}`;
            for (let j = 0; j < 5; j++) {
                row.innerHTML += `<div class="cell" onclick="chooseApple(${j})"><i class="fa fa-question" style="opacity:0.1"></i></div>`;
            }
            grid.appendChild(row);
        }
    }

    async function initGame() {
        const res = await fetch('/game/apple-of-fortune/start', { method: 'POST' });
        const data = await res.json();
        if(data.status === 'success') {
            gameRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('cashBtn').style.display = 'block';
            activateRow(0);
        } else {
            alert(data.message);
        }
    }

    function activateRow(step) {
        document.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
        document.getElementById(`row-${step}`).classList.add('active');
        document.getElementById('step-info').innerText = `NIVEAU ${step + 1} / 10`;
    }

    async function chooseApple(index) {
        if(!gameRunning) return;
        
        const res = await fetch('/game/apple-of-fortune/check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ choice: index })
        });
        const data = await res.json();

        const row = document.getElementById(`row-${currentStep}`);
        const cells = row.querySelectorAll('.cell');
        
        if(data.status === 'continue' || data.status === 'win') {
            cells[index].className = 'cell good';
            cells[index].innerHTML = '<i class="fa fa-apple-alt"></i>';
            document.getElementById('gain-val').innerText = data.new_gain || data.gain;
            
            if(data.status === 'win') {
                alert("🏆 RÉCOLTE PARFAITE !");
                location.href = "/dashboard";
            } else {
                currentStep++;
                activateRow(currentStep);
            }
        } else {
            cells[index].className = 'cell bad';
            cells[index].innerHTML = '<i class="fa fa-bomb"></i>';
            gameRunning = false;
            alert(`BOUM ! C'était une bombe. Tes ${data.gain_final} XOF ont été ajoutés à ton solde.`);
            location.href = "/dashboard";
        }
    }

    async function cashout() {
        if(!confirm("Voulez-vous vraiment arrêter et encaisser vos gains actuels ?")) return;
        const res = await fetch('/game/apple-of-fortune/cashout', { method: 'POST' });
        const data = await res.json();
        if(data.status === 'success') {
            alert(`Félicitations ! ${data.gain} XOF ajoutés.`);
            location.href = "/dashboard";
        }
    }

    window.onload = createGrid;
</script>
</body>
</html>
